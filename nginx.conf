# Nginx config for the Event Platform — reverse proxy in front of two
# PM2-managed processes: backend on port 3012, frontend (built static
# files served via `serve`) on port 5544.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/passscan.eitfaridabad.co.in
#   sudo ln -s /etc/nginx/sites-available/passscan.eitfaridabad.co.in /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then get an SSL cert (camera access in the browser REQUIRES HTTPS in
# production — browsers block getUserMedia on plain HTTP except on
# localhost):
#   sudo certbot --nginx -d passscan.eitfaridabad.co.in
# (if certbot's nginx plugin conflicts with ea-nginx on a cPanel/WHM box,
# use the webroot method instead — see the ACME location block below)

server {
    listen 80;
    listen [::]:80;
    server_name passscan.eitfaridabad.co.in;

    # required for certbot's webroot verification, if you go that route
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3012/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # frontend — proxied to the PM2-managed static server on 5544
    location / {
        proxy_pass http://127.0.0.1:5544/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10M;
}